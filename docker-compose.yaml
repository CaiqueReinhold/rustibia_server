services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rustibia
      POSTGRES_PASSWORD: rustibia
      POSTGRES_DB: rustibia
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustibia -d rustibia"]
      interval: 5s
      timeout: 5s
      retries: 5

  site:
    build:
      context: .
      dockerfile: crates/site/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rustibia:rustibia@db/rustibia?sslmode=disable
      BIND_ADDRESS: 0.0.0.0:8080
    ports:
      - "8080:8080"

  server:
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rustibia:rustibia@db/rustibia?sslmode=disable
    ports:
      - "5555:5555"

volumes:
  db_data:
