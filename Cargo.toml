[package]
name = "rustibia-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
rstar = "0.12" # Spatial indexing
pathfinding = "4"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
smallvec = "1.15.1"
tokio-stream = "0.1.18"
futures = "0.3.32"
slotmap = "1.1.1"
once_cell = "1.21.4"
serde_yaml = "0.9"
arc-swap = "1"
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "json"] }
rand = "0.8"
