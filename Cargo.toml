[workspace]
resolver = "3"
members = ["crates/server", "crates/site"]

# Shared pins live here so the two processes cannot drift apart. Two different sqlx
# versions operating on one `_sqlx_migrations` table is precisely the failure this
# architecture exists to avoid, and nothing else prevents it.
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "json", "time"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }
