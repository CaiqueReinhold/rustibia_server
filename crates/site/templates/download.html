{% extends "base.html" %}
{% block title %}Download — Rustibia{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-header">Download the Client</div>
  <div class="panel-body">
    <p>Rustibia's client is built from source. Clone the repository and run it with Cargo:</p>
    <p><code>cargo run --release</code></p>
    <p>The client connects to <code>127.0.0.1:5555</code> by default.</p>
  </div>
</div>
{% endblock %}
