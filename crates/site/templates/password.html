{% extends "base.html" %}
{% block title %}Change Password — Rustibia{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-header">Change Password</div>
  <div class="panel-body">
    {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
    {% if changed %}<p>Your password has been changed.</p>{% endif %}
    <form method="post" action="/account/password">
      <label for="current_password">Current Password</label>
      <input type="password" id="current_password" name="current_password" required>
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" required>
      <label for="new_password_confirm">Repeat New Password</label>
      <input type="password" id="new_password_confirm" name="new_password_confirm" required>
      <p><button type="submit">Change Password</button></p>
    </form>
  </div>
</div>
{% endblock %}
