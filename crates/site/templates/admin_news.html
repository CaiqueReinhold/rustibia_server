{% extends "base.html" %}
{% block title %}Post News — Rustibia{% endblock %}
{% block content %}
<div class="panel">
  <div class="panel-header">Post News</div>
  <div class="panel-body">
    {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
    {% if posted %}<p>Your post has been published.</p>{% endif %}
    <form method="post" action="/admin/news">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ title }}" required>
      <label for="body">Body</label>
      <textarea id="body" name="body" rows="10" cols="60" required>{{ body }}</textarea>
      <p><button type="submit">Publish</button></p>
    </form>
  </div>
</div>
{% endblock %}
