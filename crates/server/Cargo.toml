[package]
name = "rustibia-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

arc-swap = "1"
futures = "0.3.32"
once_cell = "1.21.4"
pathfinding = "4"
rand = "0.8"
rstar = "0.12" # Spatial indexing
serde_yaml = "0.9"
slotmap = "1.1.1"
smallvec = "1.15.1"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7", features = ["codec"] }
